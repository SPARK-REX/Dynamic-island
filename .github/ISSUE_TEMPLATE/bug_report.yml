name: Bug report
description: Create a report to help us improve Dynamic Island for Windows
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue!
  - type: input
    id: os_version
    attributes:
      label: Windows Version & Build
      description: e.g. Windows 11 23H2 (Build 22631) or Windows 10 22H2
      placeholder: Windows 11 Build ...
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behavior.
      placeholder: |
        1. Open Dynamic Island
        2. Drag island to top-center
        3. Play music in Spotify
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error Log Output
      description: Copy lines from `%AppData%\DynamicIsland\error.log` if applicable.
      render: text
